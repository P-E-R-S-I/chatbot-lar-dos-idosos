<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Albergue São Vicente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --chat-primary: #0f4c81;
      --chat-primary-hover: #0b3961;
      --chat-accent: #1a73e8;
      --chat-bg: #ffffff;
      --chat-text: #1e293b;
      --chat-text-muted: #64748b;
      --chat-border: #e2e8f0;
      --chat-shadow: 0 20px 50px rgba(15, 23, 42, 0.14), 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Botão flutuante */
    #chat-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a73e8 0%, #0f4c81 100%);
      border: 2px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(15, 76, 129, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
    }

    #chat-toggle:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 28px rgba(15, 76, 129, 0.42);
    }

    #chat-toggle:active {
      transform: translateY(0) scale(0.97);
    }

    #chat-toggle svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
      transition: transform 0.25s ease;
    }

    /* Janela de chat */
    #chat-window {
      position: fixed;
      bottom: 98px;
      right: 24px;
      width: 380px;
      max-width: calc(100vw - 32px);
      height: 560px;
      max-height: calc(100vh - 120px);
      background: #ffffff;
      border: 1px solid var(--chat-border);
      border-radius: 22px;
      box-shadow: var(--chat-shadow);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 9998;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      animation: chatSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes chatSlideUp {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #chat-window.aberto {
      display: flex;
    }

    /* Header */
    .chat-header {
      background: #ffffff;
      color: var(--chat-text);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .chat-header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1a73e8 0%, #0f4c81 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(26, 115, 232, 0.22);
      flex-shrink: 0;
    }

    .chat-header-info {
      flex: 1;
      min-width: 0;
    }

    .chat-header-name {
      font-weight: 600;
      font-size: 15px;
      color: #0f172a;
      line-height: 1.3;
    }

    .chat-header-status {
      font-size: 12px;
      color: var(--chat-text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }

    .chat-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .chat-close-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    /* Mensagens (Fundo Branco Puro) */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: msgFadeIn 0.2s ease-out;
    }

    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      flex-direction: row-reverse;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .msg.bot .bubble {
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 5px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, #1a73e8 0%, #0f4c81 100%);
      color: #ffffff;
      border-bottom-right-radius: 5px;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.18);
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bot .avatar {
      background: #f0f7ff;
      color: #1a73e8;
      border: 1px solid #dbeafe;
    }

    .user .avatar {
      background: #0f4c81;
      color: #ffffff;
    }

    /* Digitando */
    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
    }

    .typing span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
      animation: blink 1.3s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

    /* Botão de atendimento humano */
    .human-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 500;
      color: #0f4c81;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
      background: #ffffff;
      transition: all 0.15s ease;
    }

    .human-btn:hover {
      background: #f8fafc;
      border-color: #1a73e8;
      color: #1a73e8;
    }

    /* Área de Input */
    .chat-input {
      padding: 12px 14px;
      background: #ffffff;
      border-top: 1px solid #f1f5f9;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 4px 6px 4px 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .chat-input-wrapper:focus-within {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12);
    }

    .chat-input textarea {
      flex: 1;
      padding: 6px 0;
      border: none;
      background: transparent;
      font-size: 14.5px;
      line-height: 1.4;
      color: #0f172a;
      resize: none;
      height: 22px;
      max-height: 80px;
      font-family: inherit;
      outline: none;
    }

    .chat-input textarea::placeholder {
      color: #94a3b8;
    }

    .chat-input button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a73e8 0%, #0f4c81 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .chat-input button:hover:not(:disabled) {
      transform: scale(1.05);
    }

    .chat-input button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .chat-input button svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
      margin-left: 2px;
    }
  </style>
</head>
<body>

<!-- Botão flutuante -->
<button id="chat-toggle" aria-label="Abrir atendimento virtual">
  <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
</button>

<!-- Janela de chat -->
<div id="chat-window">
  <div class="chat-header">
    <div class="chat-header-avatar">SV</div>
    <div class="chat-header-info">
      <div class="chat-header-name">Albergue São Vicente</div>
      <div class="chat-header-status">
        <span class="status-dot"></span>
        <span>Atendente virtual online</span>
      </div>
    </div>
    <button class="chat-close-btn" id="chat-close" aria-label="Fechar chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="chat-messages" id="messages"></div>

  <div class="chat-input">
    <div class="chat-input-wrapper">
      <textarea id="userInput" rows="1" placeholder="Digite sua dúvida..."></textarea>
      <button id="sendBtn" aria-label="Enviar mensagem">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "/chat";

  // Gera ou recupera session_id
  let sessionId = localStorage.getItem("session_id");
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    localStorage.setItem("session_id", sessionId);
  }

  const toggle = document.getElementById("chat-toggle");
  const closeBtn = document.getElementById("chat-close");
  const window_ = document.getElementById("chat-window");
  const messages = document.getElementById("messages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  // Abre/fecha o chat
  toggle.onclick = () => {
    window_.classList.toggle("aberto");
    if (window_.classList.contains("aberto") && messages.children.length === 0) {
      addMsg("bot", "Olá! Sou o atendente virtual do Albergue São Vicente de Paula. 😊 Como posso ajudar?");
    }
    if (window_.classList.contains("aberto")) {
      userInput.focus();
    }
  };

  closeBtn.onclick = () => {
    window_.classList.remove("aberto");
  };

  function formatText(parent, text) {
    const lines = String(text).split("\n");
    lines.forEach((line, lineIdx) => {
      if (lineIdx > 0) parent.appendChild(document.createElement("br"));
      const parts = line.split(/(\*\*[^*]+\*\*)/g);
      parts.forEach(part => {
        if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
          const strong = document.createElement("strong");
          strong.textContent = part.slice(2, -2);
          parent.appendChild(strong);
        } else if (part) {
          parent.appendChild(document.createTextNode(part));
        }
      });
    });
  }

  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;

    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = role === "bot" ? "SV" : "Eu";

    const bub = document.createElement("div");
    bub.className = "bubble";
    formatText(bub, text);

    if (role === "bot") {
      const btn = document.createElement("button");
      btn.className = "human-btn";
      btn.textContent = "👤 Falar com pessoa real";
      btn.onclick = () => addMsg("bot", "Entendido! Para falar diretamente com nossa equipe, entre em contato pelo telefone/WhatsApp (64) 3631-1437 ou presencialmente na Rua Miranda de Carvalho, 1929 – Jataí/GO. 🙏");
      bub.appendChild(document.createElement("br"));
      bub.appendChild(btn);
    }

    div.appendChild(av);
    div.appendChild(bub);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.id = "typing";
    div.innerHTML = '<div class="avatar">SV</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function send() {
    const text = userInput.value.trim();
    if (!text) return;

    userInput.value = "";
    sendBtn.disabled = true;
    addMsg("user", text);
    addTyping();

    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, texto: text })
      });

      const data = await res.json();
      if (!res.ok || typeof data.resposta !== "string") throw new Error("Backend indisponível");
      removeTyping();
      addMsg("bot", data.resposta);
    } catch (e) {
      removeTyping();
      addMsg("bot", "Erro de conexão. Tente novamente.");
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  sendBtn.onclick = send;
  userInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>

</body>
</html>
